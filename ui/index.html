<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>XLR8 Editor</title>
  <link rel="stylesheet" href="style.css">
  <script type='module' src='./src/app.js'></script>
</head>
<body>
  <div id="bar"><pear-ctrl></pear-ctrl></div>
  
  <div id="editor-container">
    <div id="line-numbers"></div>
    <div id="editor-wrapper">
      <pre id="highlighting" aria-hidden="true"><code id="highlighting-content" class="language-javascript"></code></pre>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
  </div>
  
  <div id="status-bar">
    <span id="mode-indicator">-- INSERT --</span>
    <span id="file-info"></span>
  </div>
  
  <div id="command-line">
    <span id="command-prompt">:</span>
    <input type="text" id="command-input" autocomplete="off" />
  </div>
  
  <div id="autocomplete-popup" style="display: none;">
    <ul id="autocomplete-list"></ul>
  </div>
</body>
</html>
